name: Checkout html test

# Throwaway. Answers: does a plain checkout of html/ fit on a hosted runner, and how long does it take?

on:
  pull_request:
    paths: [".github/workflows/checkout-html-test.yml"]

permissions:
  contents: read

jobs:
  checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Disk before
        run: df -h / /mnt | cat

      - name: Checkout html/ only
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: html
          sparse-checkout-cone-mode: true
          fetch-depth: 1
          persist-credentials: false

      - name: Disk after
        if: ${{ !cancelled() }}
        run: |
          df -h / /mnt | cat
          du -sh html .git
          echo "files: $(find html -type f | wc -l)"
          {
            echo "### Checkout html/ test"
            echo '```'
            df -h / | cat
            du -sh html .git
            echo "files: $(find html -type f | wc -l)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
